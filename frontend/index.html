<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI 自动对诗平台</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Ma+Shan+Zheng&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="page-bg" aria-hidden="true"></div>

<header class="topbar">
  <div class="brand">
    <h1 class="brand-title">对诗台</h1>
    <p class="brand-sub">AI 自动对诗 · 联对接唱，词令随心</p>
  </div>
  <div class="topbar-right">
    <span id="ai-badge" class="ai-badge" title="当前 AI 通道">检测中…</span>
    <button id="btn-history" class="icon-btn" title="对诗历史" aria-label="对诗历史">史</button>
    <button id="btn-settings" class="icon-btn" title="设置" aria-label="设置">⚙</button>
  </div>
</header>

<nav class="mode-tabs" id="mode-tabs" aria-label="对诗模式">
  <button class="mode-tab active" data-mode="duilian"><span class="mode-name">对联</span><span class="mode-desc">出上联，对下联</span></button>
  <button class="mode-tab" data-mode="jielong"><span class="mode-name">接龙</span><span class="mode-desc">尾字押韵续句</span></button>
  <button class="mode-tab" data-mode="changhe"><span class="mode-name">唱和</span><span class="mode-desc">依风格回应</span></button>
  <button class="mode-tab" data-mode="feihualing"><span class="mode-name">飞花令</span><span class="mode-desc">含字即诗</span></button>
</nav>

<main class="stage">
  <div class="chat" id="chat" aria-live="polite">
    <div class="chat-empty" id="chat-empty">
      <p class="empty-seal">诗</p>
      <p class="empty-hint">请出上句，待 AI 对诗。</p>
      <p class="empty-examples" id="empty-examples"></p>
    </div>
  </div>
</main>

<footer class="compose">
  <textarea id="input" rows="2" placeholder="请输入诗句或题目，如：绿水青山" aria-label="输入内容"></textarea>
  <button id="btn-mic" class="mic-btn" title="语音输入" aria-label="语音输入">
    <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="9" y="2" width="6" height="12" rx="3"/><path d="M5 10v1a7 7 0 0 0 14 0v-1"/><line x1="12" y1="18" x2="12" y2="22"/></svg>
  </button>
  <button id="btn-send" class="send-btn" aria-label="发送">对</button>
</footer>

<div class="settings-mask" id="history-mask" hidden></div>
<aside class="settings" id="history-panel" hidden>
  <div class="settings-head">
    <h2>对诗历史</h2>
    <div class="head-actions">
      <button id="btn-new-session" class="text-btn" title="开始新对话">＋ 新会话</button>
      <button id="btn-clear-history" class="text-btn danger" title="清空全部记录">清空</button>
      <button id="btn-close-history" class="icon-btn" aria-label="关闭">✕</button>
    </div>
  </div>
  <div class="settings-body" id="history-list"></div>
</aside>

<div class="settings-mask" id="settings-mask" hidden></div>
<aside class="settings" id="settings" hidden>
  <div class="settings-head">
    <h2>设置</h2>
    <button id="btn-close-settings" class="icon-btn" aria-label="关闭">✕</button>
  </div>
  <div class="settings-body">
    <section>
      <h3>云端大模型</h3>
      <label>接口地址 base_url<input id="set-cloud-url" type="text" placeholder="https://api.deepseek.com/v1"></label>
      <label>API Key<input id="set-cloud-key" type="password" placeholder="留空则禁用云端"></label>
      <label>模型名<input id="set-cloud-model" type="text" placeholder="deepseek-chat"></label>
      <p class="field-tip">任意 OpenAI 兼容厂商皆可：DeepSeek / 通义 / 豆包 / Kimi</p>
    </section>
    <section>
      <h3>本地模型（Ollama）</h3>
      <label>接口地址<input id="set-local-url" type="text" placeholder="http://localhost:11434/v1"></label>
      <label>模型名<input id="set-local-model" type="text" placeholder="qwen2.5:7b"></label>
    </section>
    <section>
      <h3>通道策略</h3>
      <label class="check"><input id="set-force-local" type="checkbox"> 强制使用本地模型（隐私场景）</label>
      <p class="field-tip">默认云端优先，云端不可用时自动切换本地，均不可用时使用内置示例。</p>
    </section>
    <button id="btn-save-settings" class="primary-btn">保存设置</button>
  </div>
</aside>

<script src="js/app.js"></script>
</body>
</html>
